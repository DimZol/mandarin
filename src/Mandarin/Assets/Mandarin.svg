<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256">
  <defs>
    <!-- peel: warm radial light from the upper left -->
    <radialGradient id="peel" cx="0.36" cy="0.30" r="0.80">
      <stop offset="0" stop-color="#FFC27A"/>
      <stop offset="0.38" stop-color="#FF9A3C"/>
      <stop offset="0.78" stop-color="#F06A1A"/>
      <stop offset="1" stop-color="#C9500D"/>
    </radialGradient>
    <!-- rim light on the lower right edge -->
    <radialGradient id="rim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.82" stop-color="#FFB060" stop-opacity="0"/>
      <stop offset="0.97" stop-color="#FFB060" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFB060" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gloss" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dimple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B9480A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#B9480A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0.05" y1="0.95" x2="0.95" y2="0.05">
      <stop offset="0" stop-color="#1F8A47"/>
      <stop offset="0.55" stop-color="#3DB065"/>
      <stop offset="1" stop-color="#7FD796"/>
    </linearGradient>
    <linearGradient id="leafShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B4A22" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6B4A2E"/>
      <stop offset="1" stop-color="#8E6A47"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blur2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <clipPath id="fruitClip">
      <path d="M128 66 C186 66 228 98 228 150 C228 200 184 230 128 230 C72 230 28 200 28 150 C28 98 70 66 128 66 Z"/>
    </clipPath>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="128" cy="233" rx="80" ry="8" fill="#000000" opacity="0.22" filter="url(#soft)"/>

  <!-- fruit: slightly flattened sphere -->
  <path d="M128 66 C186 66 228 98 228 150 C228 200 184 230 128 230 C72 230 28 200 28 150 C28 98 70 66 128 66 Z" fill="url(#peel)"/>
  <g clip-path="url(#fruitClip)">
    <!-- rim light and soft terminator shadow for volume -->
    <ellipse cx="128" cy="148" rx="100" ry="82" fill="url(#rim)"/>
    <ellipse cx="150" cy="202" rx="112" ry="50" fill="#B8470A" opacity="0.18" filter="url(#soft)"/>
    <!-- dimple around the stem -->
    <ellipse cx="128" cy="75" rx="26" ry="9" fill="url(#dimple)"/>
  </g>
  <!-- specular highlight -->
  <ellipse cx="90" cy="110" rx="28" ry="16" transform="rotate(-28 90 110)" fill="url(#gloss)" opacity="0.75"/>
  <ellipse cx="74" cy="136" rx="5" ry="3.5" transform="rotate(-28 74 136)" fill="#FFFFFF" opacity="0.35" filter="url(#blur2)"/>

  <!-- stem -->
  <path d="M124 77 C123 69 124 60 127 53 L133 54 C131 61 131 69 132 77 Z" fill="url(#stem)"/>
  <ellipse cx="128" cy="77" rx="8" ry="3.4" fill="#5E3F22"/>

  <!-- leaf -->
  <path d="M131 59 C146 35 178 23 214 31 C206 63 176 83 136 71 C133 67 131 63 131 59 Z" fill="url(#leaf)"/>
  <path d="M131 59 C146 35 178 23 214 31 C206 63 176 83 136 71 C133 67 131 63 131 59 Z" fill="url(#leafShade)"/>
  <!-- midrib -->
  <path d="M134 65 C156 53 180 43 208 34" fill="none" stroke="#E8FBEA" stroke-opacity="0.65" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M158 53 C162 59 166 63 172 65" fill="none" stroke="#E8FBEA" stroke-opacity="0.35" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M176 44 C181 50 186 53 192 54" fill="none" stroke="#E8FBEA" stroke-opacity="0.35" stroke-width="1.4" stroke-linecap="round"/>
</svg>
